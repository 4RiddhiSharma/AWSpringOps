version: 0.0
os: linux

files:
  # Specify source and destination for your application files.
  - source: /    # All files from the root of your deployment package
    destination: /home/ec2-user/my-app  # Destination on the EC2 instance where the files will be copied

hooks:
  ApplicationStop:
    - location: scripts/stop_application.sh
      timeout: 300
      runas: root
  ApplicationStart:
    - location: scripts/start_application.sh
      timeout: 300
      runas: root


